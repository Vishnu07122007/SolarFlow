<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Register | SolarFlow</title>
  <link rel="icon" type="image/x-icon" href="../favicon.ico">

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen min-h-[100dvh] flex items-center justify-center p-4 sm:p-6">
  <div id="page_loader" class="hidden fixed inset-0 z-[9999] bg-black/55 flex items-center justify-center">
    <div class="bg-slate-900 border border-slate-600 rounded-2xl px-6 py-5 text-center shadow-2xl">
      <div class="w-8 h-8 border-2 border-amber-400 border-t-transparent rounded-full animate-spin mx-auto mb-3"></div>
      <div class="text-sm text-amber-300 font-semibold">Creating account…</div>
    </div>
  </div>
  <div class="w-full max-w-md bg-slate-800/90 border border-slate-700/60 p-5 sm:p-8 rounded-2xl sm:rounded-3xl shadow-2xl space-y-5 sm:space-y-6">
    <div class="text-center">
      <h1 class="text-xl sm:text-2xl font-extrabold text-white">Create <span class="text-amber-400">Account</span></h1>
      <p class="text-xs sm:text-sm text-slate-400 mt-1">Uttar Pradesh rooftop solar forecasts</p>
    </div>

    {% if error %}
    <div class="bg-red-500/10 border border-red-500/30 text-red-400 text-xs sm:text-sm p-3 rounded-xl text-center font-semibold">
      {{ error }}
    </div>
    {% endif %}

    <form action="/register" method="POST" class="space-y-4">
      <div>
        <label class="block text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
        <input type="text" name="name" required autocomplete="name"
               class="w-full bg-slate-900 border border-slate-700 rounded-xl sm:rounded-2xl px-3 sm:px-4 py-3 text-sm text-white focus:ring-2 focus:ring-amber-400 outline-none"
               placeholder="Your name">
      </div>
      <div>
        <label class="block text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
        <input type="email" name="email" required autocomplete="email"
               class="w-full bg-slate-900 border border-slate-700 rounded-xl sm:rounded-2xl px-3 sm:px-4 py-3 text-sm text-white focus:ring-2 focus:ring-amber-400 outline-none"
               placeholder="Enter your email">
      </div>
      <div>
        <label class="block text-[11px] sm:text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
        <input type="password" name="password" required minlength="6" autocomplete="new-password"
               class="w-full bg-slate-900 border border-slate-700 rounded-xl sm:rounded-2xl px-3 sm:px-4 py-3 text-sm text-white focus:ring-2 focus:ring-amber-400 outline-none"
               placeholder="At least 6 characters">
      </div>
      <button type="submit"
              class="w-full bg-amber-400 hover:bg-amber-300 text-slate-950 font-bold py-3 sm:py-3.5 rounded-xl sm:rounded-2xl text-sm transition shadow-lg">
        Create Account
      </button>
    </form>

    <div class="text-center text-xs sm:text-sm">
      <a href="/login" class="text-amber-400 hover:underline">Already have an account? Sign In</a>
    </div>
  </div>
  <script>
    document.querySelector('form').addEventListener('submit', function () {
      var el = document.getElementById('page_loader');
      if (el) el.classList.remove('hidden');
    });
  </script>
</body>
</html>
